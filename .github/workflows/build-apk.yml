name: Build Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip python3-setuptools autoconf libtool libtool-bin pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev clang lld

      - name: Cache Buildozer SDK and NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install Buildozer and Cython
        run: |
          python3 -m pip install --upgrade pip
          pip install --user --upgrade buildozer cython==0.29.36 virtualenv

      - name: Build debug APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
          ACLOCAL_PATH: "/usr/share/aclocal"
          ACLOCAL: "aclocal -I /usr/share/aclocal"
          AUTORECONF: "${{ runner.temp }}/autoreconf-lt.sh"
        run: |
          if [ ! -f /usr/bin/aclocal.orig ]; then
            sudo cp /usr/bin/aclocal /usr/bin/aclocal.orig
          fi
          sudo tee /usr/bin/aclocal > /dev/null <<'ACLOCAL_EOF'
          #!/usr/bin/env bash
          set -e
          if [ -d "/usr/share/aclocal" ]; then
            exec /usr/bin/aclocal.orig -I /usr/share/aclocal "$@"
          fi
          exec /usr/bin/aclocal.orig "$@"
          ACLOCAL_EOF
          sudo chmod +x /usr/bin/aclocal
          if [ ! -f /usr/bin/autoreconf.orig ]; then
            sudo cp /usr/bin/autoreconf /usr/bin/autoreconf.orig
          fi
          sudo tee /usr/bin/autoreconf > /dev/null <<'AUTORECONF_EOF'
          #!/usr/bin/env bash
          set -e
          if [ -f "configure.ac" ]; then
            mkdir -p m4
            if compgen -G "/usr/share/aclocal/lt*.m4" > /dev/null; then
              cp -f /usr/share/aclocal/lt*.m4 m4/
            fi
            /usr/bin/aclocal -I m4 -I /usr/share/aclocal --force || true
          fi
          exec /usr/bin/autoreconf.orig "$@"
          AUTORECONF_EOF
          sudo chmod +x /usr/bin/autoreconf
          export PATH="$HOME/.local/bin:$PATH"
          yes | buildozer android debug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: punksomni-debug-apk
          path: bin/*.apk
