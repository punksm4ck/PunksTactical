name: Build Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip python3-setuptools autoconf libtool libtool-bin pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev clang lld

      - name: Cache Buildozer SDK and NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install Buildozer and Cython
        run: |
          python3 -m pip install --upgrade pip
          pip install --user --upgrade buildozer cython==0.29.36 virtualenv

      - name: Build debug APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
          ACLOCAL_PATH: "/usr/share/aclocal"
          ACLOCAL: "aclocal -I /usr/share/aclocal"
          AUTORECONF: "${{ runner.temp }}/autoreconf-lt.sh"
        run: |
          mkdir -p "${{ runner.temp }}/bin"
          cat <<'AUTORECONF_EOF' > "${{ runner.temp }}/bin/autoreconf"
          #!/usr/bin/env bash
          set -e
          if [ -d "m4" ] && compgen -G "/usr/share/aclocal/lt*.m4" > /dev/null; then
            cp -f /usr/share/aclocal/lt*.m4 m4/
          fi
          if [ -f "configure.ac" ]; then
            aclocal -I m4 -I /usr/share/aclocal --force || true
          fi
          exec /usr/bin/autoreconf "$@"
          AUTORECONF_EOF
          chmod +x "${{ runner.temp }}/bin/autoreconf"
          export PATH="${{ runner.temp }}/bin:$HOME/.local/bin:$PATH"
          yes | buildozer android debug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: punksomni-debug-apk
          path: bin/*.apk
