name: Build Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip python3-setuptools autoconf libtool libtool-bin pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev clang lld

      - name: Cache Buildozer SDK and NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install Buildozer and Cython
        run: |
          python3 -m pip install --upgrade pip
          pip install --user --upgrade buildozer cython==0.29.36 virtualenv

      - name: Build debug APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
          JAVA_HOME: "/usr/lib/jvm/java-17-openjdk-amd64"
          VIRTUALENV_PIP: "bundle"
          VIRTUALENV_NO_DOWNLOAD: "1"
          ACLOCAL_PATH: "/usr/share/aclocal"
          ACLOCAL: "aclocal -I /usr/share/aclocal"
          AUTORECONF: "${{ runner.temp }}/autoreconf-lt.sh"
        run: |
          if [ ! -f /usr/bin/autoreconf.orig ]; then
            sudo cp /usr/bin/autoreconf /usr/bin/autoreconf.orig
          fi
          sudo tee /usr/bin/autoreconf > /dev/null <<'AUTORECONF_EOF'
          #!/usr/bin/env bash
          set -e
          if [ -f "configure.ac" ] && grep -q "LT_SYS_SYMBOL_USCORE" configure.ac; then
            if [ -f "acinclude.m4" ] && grep -q "LT_SYS_SYMBOL_USCORE" acinclude.m4; then
              :
            elif [ -f "/usr/share/aclocal/ltsymbol.m4" ]; then
              cat /usr/share/aclocal/ltsymbol.m4 >> acinclude.m4
            else
              printf '\nm4_ifndef([LT_SYS_SYMBOL_USCORE], [AC_DEFUN([LT_SYS_SYMBOL_USCORE], [])])\n' >> acinclude.m4
            fi
          fi
          exec /usr/bin/autoreconf.orig "$@"
          AUTORECONF_EOF
          sudo chmod +x /usr/bin/autoreconf
          export PATH="$JAVA_HOME/bin:$HOME/.local/bin:$PATH"
          rm -rf .buildozer/android/platform/build-*/build/venv
          yes | buildozer android debug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: punksomni-debug-apk
          path: bin/*.apk
